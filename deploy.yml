name: Build & Deploy ZoPhysicist

# Runs every time you add or change a .tex file (or anything else) on main.
on:
  push:
    branches: [ main ]
  workflow_dispatch:        # also lets you trigger it manually from the Actions tab

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get the repository
        uses: actions/checkout@v4

      - name: Install Pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Build the site
        run: python3 build.py

      - name: Upload built site as a downloadable backup
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/

      # ---- Deploy to InfinityFree over FTP ----
      # Set these 3 repository secrets first (see README, section 2):
      #   FTP_SERVER    e.g.  ftpupload.net
      #   FTP_USERNAME  e.g.  epiz_12345678
      #   FTP_PASSWORD  your InfinityFree FTP password
      - name: Deploy to InfinityFree
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:       ${{ secrets.FTP_SERVER }}
          username:     ${{ secrets.FTP_USERNAME }}
          password:     ${{ secrets.FTP_PASSWORD }}
          local-dir:    ./site/
          server-dir:   /htdocs/
          # Incremental sync: only changed files are uploaded each time,
          # which keeps you well inside InfinityFree's limits.
          dangerous-clean-slate: false
